Name: flowdesk-api
Host: 0.0.0.0
Port: 8080
Mode: dev
Prometheus:
  Host: 0.0.0.0
  Port: 9101
  Path: /metrics
Telemetry:
  Name: flowdesk-api
  Endpoint: ${OTEL_COLLECTOR_ENDPOINT}
  Batcher: otlphttp
  Sampler: 1.0
Middlewares:
  Log: false
Timeout: 10000
MaxBytes: 4194304
DatabaseUrl: ${DATABASE_URL}
JwtSecret: ${JWT_SECRET}
InternalToken: ${INTERNAL_TOKEN}
AgentUrl: ${AGENT_URL}
AllowedOrigins: ${ALLOWED_ORIGINS}
CookieSecure: ${COOKIE_SECURE}
