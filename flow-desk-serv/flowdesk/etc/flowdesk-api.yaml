Name: flowdesk-api
Host: 0.0.0.0
Port: 8080
Mode: dev
Prometheus:
  Host: 0.0.0.0
  Port: 9101
  Path: /metrics
Telemetry:
  Name: flowdesk-api
  Endpoint: ${OTEL_COLLECTOR_ENDPOINT}
  Batcher: otlphttp
  Sampler: 1.0
Middlewares:
  Log: false
Timeout: 10000
MaxBytes: 4194304
DatabaseUrl: ${DATABASE_URL}
JwtSecret: ${JWT_SECRET}
InternalToken: ${INTERNAL_TOKEN}
AgentUrl: ${AGENT_URL}
AllowedOrigins: ${ALLOWED_ORIGINS}
CookieSecure: ${COOKIE_SECURE}
FileStoreProvider: ${FILE_STORE_PROVIDER}
FileStoreCleanupEnabled: ${FILE_STORE_CLEANUP_ENABLED}
FileStoreTenantInventoryEnabled: ${FILE_STORE_TENANT_INVENTORY_ENABLED}
FileStoreInventoryEnabled: ${FILE_STORE_INVENTORY_ENABLED}
FileStoreAdoptionEnabled: ${FILE_STORE_ADOPTION_ENABLED}
FileStoreEndpoint: ${FILE_STORE_ENDPOINT}
FileStoreRegion: ${FILE_STORE_REGION}
FileStoreBucket: ${FILE_STORE_BUCKET}
FileStoreAccessKey: ${FILE_STORE_ACCESS_KEY}
FileStoreSecretKey: ${FILE_STORE_SECRET_KEY}
FileStoreAllowHTTP: ${FILE_STORE_ALLOW_HTTP}
