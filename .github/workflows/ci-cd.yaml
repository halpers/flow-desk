name: CI and container delivery

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Tests and Compose smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: flowdesk_ci
          POSTGRES_DB: flowdesk_ci
          # Disposable runner database only; no business credentials or data.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowdesk_ci -d flowdesk_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://flowdesk_ci@localhost:5432/flowdesk_ci?sslmode=disable
      AGENT_TEST_DATABASE_URL: postgresql://flowdesk_ci@localhost:5432/flowdesk_ci
      GOPROXY: https://proxy.golang.org,direct
      PYPI_INDEX_URL: https://pypi.org/simple
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: flow-desk-serv/flowdesk/go.mod
          cache-dependency-path: flow-desk-serv/flowdesk/go.sum
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flow-desk-agent/requirements.lock
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: flow-desk-web/package.json
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: flow-desk-web/pnpm-lock.yaml
      - name: Check Go formatting, static analysis and integration tests
        working-directory: flow-desk-serv/flowdesk
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [[ -n "$unformatted" ]]; then printf '%s\n' "$unformatted"; exit 1; fi
          go vet ./...
          go test -count=1 ./...
      - name: Check Agent and run isolated-schema tests
        working-directory: flow-desk-agent
        run: |
          python -m pip install -r requirements.lock
          python -m ruff check src scripts
          python -m pytest -q --tb=short
      - name: Test and build Web
        working-directory: flow-desk-web
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - name: Generate disposable local configuration
        shell: pwsh
        run: ./scripts/bootstrap-local.ps1
      - name: Validate and start Compose
        run: |
          docker compose config --quiet
          docker compose up --detach --build --wait --wait-timeout 180
          docker compose ps --all
      - name: Check HTTP authentication through Web proxy
        run: python scripts/smoke.py
      - name: Clean up disposable Compose stack
        if: always()
        run: |
          if [[ -f .env ]]; then docker compose down --volumes --remove-orphans; fi

  publish:
    name: Publish ${{ matrix.service }} to GHCR and Aliyun
    needs: checks
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: ./flow-desk-serv/flowdesk
          - service: agent
            context: ./flow-desk-agent
          - service: web
            context: ./flow-desk-web
    env:
      ACR_REGISTRY: ${{ vars.ACR_REGISTRY || 'crpi-1bbvvu1xvdtg7e0p.cn-hangzhou.personal.cr.aliyuncs.com' }}
      ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE || 'flow-desk' }}
      SERVICE: ${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check registry configuration and generate matching tags
        id: images
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          : "${ACR_USERNAME:?Set repository secret ACR_USERNAME}"
          : "${ACR_PASSWORD:?Set repository secret ACR_PASSWORD}"
          [[ "$ACR_REGISTRY" =~ ^[a-z0-9][a-z0-9.-]*[a-z0-9]$ ]]
          [[ "$ACR_NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
          if [[ "$ACR_REGISTRY" == *-vpc.* ]]; then
            echo '::error::GitHub-hosted runners require the public ACR endpoint.'
            exit 1
          fi
          ghcr_image="ghcr.io/${GITHUB_REPOSITORY,,}-${SERVICE}"
          acr_image="${ACR_REGISTRY}/${ACR_NAMESPACE}/${GITHUB_REPOSITORY#*/}-${SERVICE}"
          acr_image="${acr_image,,}"
          version="sha-${GITHUB_SHA}"
          alias=latest
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            alias="$GITHUB_REF_NAME"
            [[ "$alias" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
          fi
          {
            echo "ghcr=$ghcr_image"
            echo "acr=$acr_image"
            echo 'tags<<FLOWDESK_TAGS'
            printf '%s\n' "$ghcr_image:$version" "$acr_image:$version" "$ghcr_image:$alias" "$acr_image:$alias"
            echo 'FLOWDESK_TAGS'
          } >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Aliyun ACR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build once and push to both registries
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
            PIP_INDEX_URL=https://pypi.org/simple
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          # Keep a single-platform manifest compatible with Personal Edition ACR.
          provenance: false
          sbom: false
      - name: Summarize published images
        env:
          GHCR_IMAGE: ${{ steps.images.outputs.ghcr }}
          ACR_IMAGE: ${{ steps.images.outputs.acr }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            printf '### %s\n\n' "$SERVICE"
            printf -- '- `%s:sha-%s`\n' "$GHCR_IMAGE" "$GITHUB_SHA"
            printf -- '- `%s:sha-%s`\n' "$ACR_IMAGE" "$GITHUB_SHA"
            printf -- '- Digest: `%s`\n' "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
