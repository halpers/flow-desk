name: CI and container delivery

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Tests and Compose smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: flowdesk_ci
          POSTGRES_DB: flowdesk_ci
          # Disposable runner database only; no business credentials or data.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowdesk_ci -d flowdesk_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://flowdesk_ci@localhost:5432/flowdesk_ci?sslmode=disable
      AGENT_TEST_DATABASE_URL: postgresql://flowdesk_ci@localhost:5432/flowdesk_ci
      GOPROXY: https://proxy.golang.org,direct
      PYPI_INDEX_URL: https://pypi.org/simple
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: flow-desk-serv/flowdesk/go.mod
          cache-dependency-path: flow-desk-serv/flowdesk/go.sum
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flow-desk-agent/requirements.lock
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: flow-desk-web/package.json
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Cache project pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/pnpm-store
          key: ${{ runner.os }}-pnpm-node24-${{ hashFiles('flow-desk-web/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-node24-
      - name: Check Go formatting, static analysis and integration tests
        working-directory: flow-desk-serv/flowdesk
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [[ -n "$unformatted" ]]; then printf '%s\n' "$unformatted"; exit 1; fi
          go vet ./...
          go test -count=1 ./...
      - name: Install Agent dependencies
        working-directory: flow-desk-agent
        run: python -m pip install -r requirements.lock
      - name: Check bounded acceptance login rate-limit recovery
        run: python -m unittest discover -s scripts/tests -v
      - name: Initialize pgvector in disposable test database
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["AGENT_TEST_DATABASE_URL"], autocommit=True) as connection:
              connection.execute("CREATE SCHEMA knowledge")
              connection.execute("CREATE EXTENSION vector WITH SCHEMA knowledge")
          PY
      - name: Check Agent static analysis
        working-directory: flow-desk-agent
        run: python -m ruff check src scripts
      - name: Run Agent isolated-schema tests
        working-directory: flow-desk-agent
        run: python -m pytest -q --tb=short
      - name: Check isolated synthetic semantic retrieval scale
        run: |
          python -m ruff check scripts/benchmark-retrieval-scale.py scripts/check-run-lifecycle.py
          python scripts/benchmark-retrieval-scale.py --rows 10000 --dimension 64 --queries 40 --output work/retrieval-scale-ci.json
      - name: Test and build Web
        working-directory: flow-desk-web
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - name: Generate disposable local configuration
        shell: pwsh
        run: ./scripts/bootstrap-local.ps1
      - name: Validate server IP entry and credential bootstrap
        run: python scripts/check-server-entry.py
      - name: Validate and start Compose
        run: |
          docker compose config --quiet
          docker compose up --detach --build --wait --wait-timeout 180
          docker compose ps --all
      - name: Check independent Agent migration and DML-only runtime
        run: |
          mkdir -p work
          install -m 600 .env work/agent-migration-ci.env
          python scripts/check-agent-migration.py --env-file work/agent-migration-ci.env --output work/agent-migration-ci.json
      - name: Check HTTP authentication through Web proxy
        run: python scripts/smoke.py
      - name: Check account roles, password recovery and session revocation
        run: python scripts/check-accounts.py --output work/accounts-ci.json
      - name: Check owner password changes and complete session revocation
        run: |
          mkdir -p work
          install -m 600 .env work/password-ci.env
          python scripts/check-self-password.py --env-file work/password-ci.env --output work/self-password-ci.json
      - name: Check persistent shared authentication budgets across two APIs and restart
        run: |
          install -m 600 .env work/auth-rate-ci.env
          trap 'docker rm --force flowdesk-rate-ci-api2 >/dev/null 2>&1 || true' EXIT
          docker compose --file docker-compose.yaml run --detach --no-deps --publish 127.0.0.1:18081:8080 --name flowdesk-rate-ci-api2 api
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18081/health/ready >/dev/null; then break; fi
            sleep 1
          done
          python scripts/check-auth-rate-limits.py --env-file work/auth-rate-ci.env --api-two http://localhost:18081/api/v1 --fixture work/auth-rate-fixture.json --output work/auth-rate-ci.json --phase prepare
          docker restart flowdesk-rate-ci-api2
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18081/health/ready >/dev/null; then break; fi
            sleep 1
          done
          python scripts/check-auth-rate-limits.py --env-file work/auth-rate-ci.env --api-two http://localhost:18081/api/v1 --fixture work/auth-rate-fixture.json --output work/auth-rate-ci.json --phase verify
      - name: Check knowledge retention and durable index cleanup
        run: |
          mkdir -p work
          install -m 600 .env work/retention-ci.env
          python scripts/check-retention.py --env-file work/retention-ci.env --output work/retention-ci.json
      - name: Check configurable retention policy and stale preview fencing
        run: python scripts/check-retention-policy.py --env-file work/retention-ci.env --output work/retention-policy-ci.json
      - name: Check complete version history and metadata archive recovery
        run: python scripts/check-history-archive.py --env-file work/retention-ci.env --output work/history-archive-ci.json
      - name: Check fixed business scenarios through public API
        run: python scripts/check-business-scenarios.py --output work/business-scenarios-ci.json
      - name: Check scoped run traces and safe retry through public API
        run: python scripts/check-run-operations.py --output work/run-operations-ci.json
      - name: Check authorized read-only run lifecycle and recovery protection
        run: python scripts/check-run-lifecycle.py --env-file work/retention-ci.env --output work/run-lifecycle-ci.json
      - name: Check lossless run history archival and restoration
        run: python scripts/check-run-history.py --env-file work/retention-ci.env --output work/run-history-ci.json --browser-fixture work/run-history-ci-fixture.json
      - name: Check durable confirmed run history batches
        run: python scripts/check-run-history-batch.py --env-file work/retention-ci.env --output work/run-history-batch-ci.json
      - name: Check durable confirmed run history restoration batches
        run: python scripts/check-run-history-batch-restore.py --env-file work/retention-ci.env --output work/run-history-batch-restore-ci.json
      - name: Check scheduled history policy and real background archival in isolated tenant
        run: |
          cp work/retention-ci.env work/schedule-ci.env
          echo 'RUN_HISTORY_SCHEDULER_ENABLED=true' >> work/schedule-ci.env
          docker compose --env-file work/schedule-ci.env up --detach --no-deps --wait api
          python scripts/check-run-history-schedule.py --env-file work/schedule-ci.env --output work/run-history-schedule-ci.json --browser-fixture work/run-history-schedule-ci-fixture.json
      - name: Check real overdue investigation automation and persistent authorization
        run: |
          cp work/retention-ci.env work/automation-ci.env
          echo 'INVESTIGATION_AUTOMATION_ENABLED=true' >> work/automation-ci.env
          docker compose --env-file work/automation-ci.env up --detach --no-deps --wait api
          python scripts/check-investigation-automation.py --env-file work/automation-ci.env --output work/investigation-automation-ci.json
      - name: Check real native OCR in pinned Agent image
        run: |
          docker compose run --rm --no-deps --volume "$PWD/flow-desk-agent/tests:/app/tests:ro" --env FLOWDESK_NATIVE_OCR_TESTS=1 agent python -m pytest -q tests/test_ocr.py tests/test_ocr_layout.py -p no:cacheprovider
          python scripts/check-ocr.py --output work/ocr-ci.json
      - name: Check joint OCR layout extraction and both activation reviews
        run: python scripts/check-ocr-layout.py --env-file work/retention-ci.env --output work/ocr-layout-ci.json
      - name: Check original-file S3 archival and restore
        run: |
          python scripts/configure-source-storage.py
          docker compose --file docker-compose.yaml --file deploy/compose.storage.yaml config --quiet
          docker compose --file docker-compose.yaml --file deploy/compose.storage.yaml up --detach --wait --wait-timeout 180
          python scripts/check-source-storage.py --output work/source-storage-ci.json
      - name: Check PDF layout comparison, reviewed activation and citations
        run: python scripts/check-pdf-layout.py --require-s3 --output work/pdf-layout-ci.json
      - name: Check tracked archive copy cleanup and generation isolation
        run: |
          python scripts/configure-source-storage.py --enable-cleanup --enable-inventory --enable-adoption --enable-tenant-inventory
          docker compose --file docker-compose.yaml --file deploy/compose.storage.yaml up --detach --wait --wait-timeout 180
          CGO_ENABLED=0 go -C flow-desk-serv/flowdesk test -c -o "$PWD/work/source-store.test" ./internal/client
          docker compose --file docker-compose.yaml --file deploy/compose.storage.yaml run --rm --no-deps --volume "$PWD/work/source-store.test:/tmp/source-store.test:ro" --env FLOWDESK_S3_SANDBOX_TESTS=1 --env MODEL_PROVIDER=mock --entrypoint /tmp/source-store.test api -test.run '^TestS3SandboxRetirementContracts$' -test.v
          install -m 600 .env work/source-cleanup-ci.env
          python scripts/check-source-cleanup.py --env-file work/source-cleanup-ci.env --output work/source-cleanup-ci.json
      - name: Check scoped object inventory and registration reconciliation
        run: python scripts/check-source-inventory.py --env-file work/source-cleanup-ci.env --output work/source-inventory-ci.json
      - name: Check confirmed historical copy verification and registration
        run: python scripts/check-source-adoption.py --env-file work/source-cleanup-ci.env --output work/source-adoption-ci.json
      - name: Check tenant object discovery and unknown-version reconciliation
        run: python scripts/check-tenant-source-inventory.py --env-file work/source-cleanup-ci.env --output work/tenant-source-inventory-ci.json --browser-fixture work/tenant-source-inventory-ci-fixture.json
      - name: Check full archive-copy history and retired registration archival
        run: python scripts/check-source-history.py --env-file work/source-cleanup-ci.env --output work/source-history-ci.json
      - name: Check manual source investigation revisions and authorized receipt recovery
        run: python scripts/check-source-investigations.py --env-file work/source-cleanup-ci.env --inventory-fixture work/tenant-source-inventory-ci-fixture.json --output work/source-investigations-ci.json
      - name: Check tenant investigation worklist filters and permission-safe pagination
        run: python scripts/check-investigation-worklist.py --env-file work/source-cleanup-ci.env --inventory-fixture work/tenant-source-inventory-ci-fixture.json --output work/investigation-worklist-ci.json
      - name: Check immutable investigation history and scoped revision pagination
        run: python scripts/check-investigation-history.py --env-file work/source-cleanup-ci.env --inventory-fixture work/tenant-source-inventory-ci-fixture.json --output work/investigation-history-ci.json
      - name: Check confirmed investigation history restoration and receipt replay
        run: python scripts/check-investigation-restore.py --env-file work/source-cleanup-ci.env --inventory-fixture work/tenant-source-inventory-ci-fixture.json --output work/investigation-restore-ci.json
      - name: Check lossless investigation history tier archival and cold restoration
        run: python scripts/check-investigation-history-archive.py --env-file work/source-cleanup-ci.env --inventory-fixture work/tenant-source-inventory-ci-fixture.json --output work/investigation-history-archive-ci.json --browser-fixture work/investigation-history-archive-ci-fixture.json
      - name: Check previewed atomic investigation history batches and authorized receipt replay
        run: python scripts/check-investigation-history-batch.py --env-file work/source-cleanup-ci.env --inventory-fixture work/investigation-history-archive-ci-fixture.json --output work/investigation-history-batch-ci.json
      - name: Validate local monitoring and TLS configuration
        run: |
          python scripts/configure-monitoring.py
          docker compose --file docker-compose.yaml --file deploy/compose.monitoring.yaml --file deploy/compose.tls.yaml config --quiet
          docker compose --file docker-compose.yaml --file deploy/compose.monitoring.yaml run --rm --no-deps --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yaml
          docker compose --file docker-compose.yaml --file deploy/compose.monitoring.yaml run --rm --no-deps otel-collector validate --config=/etc/otelcol/config.yaml
      - name: Clean up disposable Compose stack
        if: always()
        run: |
          if [[ -f .env ]]; then docker compose --file docker-compose.yaml --file deploy/compose.storage.yaml down --volumes --remove-orphans; fi

  publish:
    name: Publish ${{ matrix.service }} to GHCR and Aliyun
    needs: checks
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: ./flow-desk-serv/flowdesk
          - service: agent
            context: ./flow-desk-agent
          - service: web
            context: ./flow-desk-web
    env:
      ACR_REGISTRY: ${{ vars.ACR_REGISTRY || 'crpi-1bbvvu1xvdtg7e0p.cn-hangzhou.personal.cr.aliyuncs.com' }}
      ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE || 'flow-desk' }}
      SERVICE: ${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check registry configuration and generate matching tags
        id: images
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          : "${ACR_USERNAME:?Set repository secret ACR_USERNAME}"
          : "${ACR_PASSWORD:?Set repository secret ACR_PASSWORD}"
          [[ "$ACR_REGISTRY" =~ ^[a-z0-9][a-z0-9.-]*[a-z0-9]$ ]]
          [[ "$ACR_NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
          if [[ "$ACR_REGISTRY" == *-vpc.* ]]; then
            echo '::error::GitHub-hosted runners require the public ACR endpoint.'
            exit 1
          fi
          ghcr_image="ghcr.io/${GITHUB_REPOSITORY,,}-${SERVICE}"
          acr_image="${ACR_REGISTRY}/${ACR_NAMESPACE}/${GITHUB_REPOSITORY#*/}-${SERVICE}"
          acr_image="${acr_image,,}"
          version="sha-${GITHUB_SHA}"
          [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == v* ]]
          release_tag="$GITHUB_REF_NAME"
          [[ "$release_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
          {
            echo "ghcr=$ghcr_image"
            echo "acr=$acr_image"
            echo 'tags<<FLOWDESK_TAGS'
            printf '%s\n' "$ghcr_image:$version" "$acr_image:$version" "$ghcr_image:$release_tag" "$acr_image:$release_tag"
            echo 'FLOWDESK_TAGS'
          } >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Aliyun ACR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build once and load the release image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          load: true
          tags: ${{ steps.images.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
            PIP_INDEX_URL=https://pypi.org/simple
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          # Keep a single-platform manifest compatible with Personal Edition ACR.
          provenance: false
          sbom: false
      - name: Push identical images with bounded retries
        env:
          IMAGE_TAGS: ${{ steps.images.outputs.tags }}
        run: |
          while IFS= read -r image_tag; do
            [[ -n "$image_tag" ]] || continue
            delivered=false
            for attempt in 1 2 3; do
              if timeout 600 docker push "$image_tag"; then
                delivered=true
                break
              fi
              echo "::warning::Push attempt $attempt failed for $image_tag"
              if [[ "$attempt" -lt 3 ]]; then sleep 15; fi
            done
            if [[ "$delivered" != true ]]; then
              echo "::error::Image was not delivered: $image_tag"
              exit 1
            fi
          done <<< "$IMAGE_TAGS"
      - name: Summarize published images
        env:
          GHCR_IMAGE: ${{ steps.images.outputs.ghcr }}
          ACR_IMAGE: ${{ steps.images.outputs.acr }}
        run: |
          # Backticks below are literal Markdown in printf format strings.
          # shellcheck disable=SC2016
          {
            printf '### %s\n\n' "$SERVICE"
            printf -- '- `%s:sha-%s`\n' "$GHCR_IMAGE" "$GITHUB_SHA"
            printf -- '- `%s:sha-%s`\n' "$ACR_IMAGE" "$GITHUB_SHA"
            printf -- '- Repo digests: `%s`\n' "$(docker image inspect --format '{{json .RepoDigests}}' "$GHCR_IMAGE:sha-$GITHUB_SHA")"
          } >> "$GITHUB_STEP_SUMMARY"
