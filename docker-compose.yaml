name: flowdesk

# Local credentials and model settings are loaded from the ignored root .env.
# Startup: postgres -> migrate -> agent -> api -> web.
services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: flowdesk_owner
      POSTGRES_DB: flowdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run bootstrap-local}
      BUSINESS_PASSWORD: ${BUSINESS_PASSWORD:?run bootstrap-local}
      AGENT_PASSWORD: ${AGENT_PASSWORD:?run bootstrap-local}
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-55432}:5432"
    volumes:
      # PostgreSQL 18 uses a versioned data directory below this mount.
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-flowdesk.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowdesk_owner -d flowdesk"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s

  migrate:
    image: ${FLOWDESK_API_IMAGE:-flowdesk-api:latest}
    build:
      context: ./flow-desk-serv/flowdesk
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    restart: "no"
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://flowdesk_owner:${POSTGRES_PASSWORD}@postgres:5432/flowdesk?sslmode=disable&search_path=business
      DEMO_PASSWORD: ${DEMO_PASSWORD:?run bootstrap-local}
    depends_on:
      postgres:
        condition: service_healthy

  agent:
    image: ${FLOWDESK_AGENT_IMAGE:-flowdesk-agent:latest}
    build:
      context: ./flow-desk-agent
      args:
        PIP_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      AGENT_DATABASE_URL: postgresql://fd_agent:${AGENT_PASSWORD}@postgres:5432/flowdesk?options=-csearch_path%3Dagent
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?run bootstrap-local}
      GO_BASE_URL: http://api:8080
      MODEL_PROVIDER: ${MODEL_PROVIDER:-mock}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_JSON_MODE: ${MODEL_JSON_MODE:-json_object}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-0}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-1}
      RETRIEVAL_PROFILE: ${RETRIEVAL_PROFILE:-baseline}
      RERANK_PROVIDER: ${RERANK_PROVIDER:-none}
      TOOL_TRANSPORT: ${TOOL_TRANSPORT:-http}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  api:
    image: ${FLOWDESK_API_IMAGE:-flowdesk-api:latest}
    build:
      context: ./flow-desk-serv/flowdesk
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      DATABASE_URL: postgres://fd_business:${BUSINESS_PASSWORD}@postgres:5432/flowdesk?sslmode=disable&search_path=business
      JWT_SECRET: ${JWT_SECRET:?run bootstrap-local}
      FILE_STORE_PROVIDER: ${FILE_STORE_PROVIDER:-postgres}
      FILE_STORE_ENDPOINT: ${FILE_STORE_ENDPOINT:-}
      FILE_STORE_REGION: ${FILE_STORE_REGION:-us-east-1}
      FILE_STORE_BUCKET: ${FILE_STORE_BUCKET:-}
      FILE_STORE_ACCESS_KEY: ${FILE_STORE_ACCESS_KEY:-}
      FILE_STORE_SECRET_KEY: ${FILE_STORE_SECRET_KEY:-}
      FILE_STORE_ALLOW_HTTP: "${FILE_STORE_ALLOW_HTTP:-false}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      APP_MODE: ${APP_MODE:-dev}
      OTEL_COLLECTOR_ENDPOINT: ${OTEL_COLLECTOR_ENDPOINT:-}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?run bootstrap-local}
      AGENT_URL: http://agent:8000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:${WEB_HOST_PORT:-13000},http://127.0.0.1:${WEB_HOST_PORT:-13000},http://localhost:5173}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-18080}:8080"
    depends_on:
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health/ready"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 10s

  web:
    image: ${FLOWDESK_WEB_IMAGE:-flowdesk-web:latest}
    build:
      context: ./flow-desk-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-13000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 5s

volumes:
  pgdata:
