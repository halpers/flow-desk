receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
  filter/events:
    error_mode: propagate
    trace_conditions:
      - context: spanevent
        conditions: ['true']
  transform/metadata:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.version"])
      - context: span
        statements:
          - keep_keys(attributes, ["http.route", "http.request.method", "http.response.status_code", "http.method", "http.status_code", "flowdesk.run_id", "flowdesk.dispatch_id", "flowdesk.generation", "flowdesk.node", "flowdesk.node.status"])
          - set(status.message, "")
  batch:
    timeout: 1s
    send_batch_size: 128
exporters:
  otlp_http/jaeger:
    endpoint: http://jaeger:4318
    sending_queue:
      queue_size: 256
    retry_on_failure:
      max_elapsed_time: 30s
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/events, transform/metadata, batch]
      exporters: [otlp_http/jaeger]
