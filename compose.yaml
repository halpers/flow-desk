name: flowdesk
services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: flowdesk_owner
      POSTGRES_DB: flowdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run bootstrap-local}
      BUSINESS_PASSWORD: ${BUSINESS_PASSWORD:?run bootstrap-local}
      AGENT_PASSWORD: ${AGENT_PASSWORD:?run bootstrap-local}
    ports: ["127.0.0.1:${PG_HOST_PORT:-55432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-flowdesk.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowdesk_owner -d flowdesk"]
      interval: 2s
      timeout: 2s
      retries: 30
  migrate:
    build: {context: ./flow-desk-serv/flowdesk, args: {GOPROXY: "${GOPROXY:-https://goproxy.cn,direct}"}}
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://flowdesk_owner:${POSTGRES_PASSWORD}@postgres:5432/flowdesk?sslmode=disable&search_path=business
      DEMO_PASSWORD: ${DEMO_PASSWORD:?run bootstrap-local}
    depends_on: {postgres: {condition: service_healthy}}
  agent:
    build: {context: ./flow-desk-agent, args: {PIP_INDEX_URL: "${PYPI_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}"}}
    environment:
      AGENT_DATABASE_URL: postgresql://fd_agent:${AGENT_PASSWORD}@postgres:5432/flowdesk?options=-csearch_path%3Dagent
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      GO_BASE_URL: http://api:8080
      MODEL_PROVIDER: ${MODEL_PROVIDER:-mock}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_JSON_MODE: ${MODEL_JSON_MODE:-json_object}
    depends_on: {migrate: {condition: service_completed_successfully}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: {context: ./flow-desk-serv/flowdesk, args: {GOPROXY: "${GOPROXY:-https://goproxy.cn,direct}"}}
    environment:
      DATABASE_URL: postgres://fd_business:${BUSINESS_PASSWORD}@postgres:5432/flowdesk?sslmode=disable&search_path=business
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      AGENT_URL: http://agent:8000
      ALLOWED_ORIGINS: http://localhost:${WEB_HOST_PORT:-13000},http://127.0.0.1:${WEB_HOST_PORT:-13000},http://localhost:5173
    ports: ["127.0.0.1:${API_HOST_PORT:-18080}:8080"]
    depends_on: {agent: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health/ready"]
      interval: 3s
      timeout: 2s
      retries: 20
  web:
    build: {context: ./flow-desk-web}
    ports: ["127.0.0.1:${WEB_HOST_PORT:-13000}:80"]
    depends_on: {api: {condition: service_healthy}}
volumes:
  pgdata:
